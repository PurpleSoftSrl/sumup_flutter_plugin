def resolveTtpCredential = { String name ->
    def propertyValue = providers.gradleProperty(name).getOrNull()?.trim()
    if (propertyValue) {
        return propertyValue
    }
    return providers.environmentVariable(name).getOrNull()?.trim() ?: ''
}
def ttpUser = resolveTtpCredential('SUMUP_TTP_MAVEN_USERNAME')
def ttpPassword = resolveTtpCredential('SUMUP_TTP_MAVEN_PASSWORD')
def hasTtpUser = !ttpUser.isEmpty()
def hasTtpPassword = !ttpPassword.isEmpty()

if (hasTtpUser != hasTtpPassword) {
    throw new GradleException(
        'Incomplete Tap-to-Pay Maven credentials: set both ' +
        'SUMUP_TTP_MAVEN_USERNAME and SUMUP_TTP_MAVEN_PASSWORD, or neither.'
    )
}

def ttpEnabled = hasTtpUser && hasTtpPassword
ext.sumupTtpEnabled = ttpEnabled

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://maven.sumup.com/releases'
            content {
                includeGroupByRegex 'com\\.sumup.*'
                includeGroup 'net.sf.smc'
            }
        }
        if (ttpEnabled) {
            maven {
                url = uri('https://tap-to-pay-sdk.fleet.live.sumup.net/')
                content {
                    includeGroup 'com.sumup.tap-to-pay'
                    includeGroup 'ca.amadis.agnos'
                }
                credentials {
                    username = ttpUser
                    password = ttpPassword
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
